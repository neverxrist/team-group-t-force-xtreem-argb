name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
        
    - name: Restore dependencies
      run: dotnet restore XtreemRgbToggle/XtreemRgbToggle/XtreemRgbToggle.csproj
      
    - name: Build
      run: dotnet build XtreemRgbToggle/XtreemRgbToggle/XtreemRgbToggle.csproj -c Release --no-restore
      
    - name: Run Tests
      run: dotnet test XtreemRgbToggle.Tests/XtreemRgbToggle.Tests.csproj --no-restore --verbosity normal
      
    - name: Publish win-x64
      run: dotnet publish XtreemRgbToggle/XtreemRgbToggle/XtreemRgbToggle.csproj -c Release -r win-x64 --self-contained false --no-build -o publish-win-x64
      
    - name: Verify native dependencies
      run: |
        if (!(Test-Path "native/PawnIOLib.dll")) { throw "Missing PawnIOLib.dll" }
        if (!(Test-Path "native/SmbusPIIX4.bin")) { throw "Missing SmbusPIIX4.bin" }
        if (!(Test-Path "native/COPYING.PawnIO.Modules")) { throw "Missing license" }
        Write-Host "Native dependencies verified"
      shell: pwsh
      
    - name: Package portable ZIP
      run: |
        Copy-Item native/PawnIOLib.dll publish-win-x64/
        Copy-Item native/SmbusPIIX4.bin publish-win-x64/
        Copy-Item native/COPYING.PawnIO.Modules publish-win-x64/
        Copy-Item README.md publish-win-x64/README.txt
        Compress-Archive -Path publish-win-x64/* -DestinationPath XtreemRgbToggle-portable.zip
      shell: pwsh
      
    - name: Calculate SHA256
      run: |
        $hash = (Get-FileHash XtreemRgbToggle-portable.zip -Algorithm SHA256).Hash
        Write-Host "SHA256: $hash"
        "$hash  XtreemRgbToggle-portable.zip" | Out-File -FilePath SHA256SUMS.txt -Encoding utf8
      shell: pwsh
      
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: XtreemRgbToggle-build
        path: |
          XtreemRgbToggle-portable.zip
          SHA256SUMS.txt
        retention-days: 30
