name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore and test
      run: |
        dotnet restore XtreemRgbToggle.sln
        dotnet test XtreemRgbToggle/XtreemRgbToggle.Tests/XtreemRgbToggle.Tests.csproj -c Release --verbosity normal

    - name: Publish self-contained win-x64
      run: >
        dotnet publish XtreemRgbToggle/XtreemRgbToggle/XtreemRgbToggle.csproj
        -c Release -r win-x64 --self-contained true
        -p:PublishSingleFile=false -p:PublishTrimmed=false
        -o publish-selfcontained

    - name: Package portable ZIP
      shell: pwsh
      run: |
        Copy-Item native/PawnIOLib.dll publish-selfcontained/ -Force
        Copy-Item native/SmbusPIIX4.bin publish-selfcontained/ -Force
        Copy-Item native/COPYING.PawnIO.Modules publish-selfcontained/ -Force
        Copy-Item README.md publish-selfcontained/README.txt -Force
        Copy-Item LICENSE publish-selfcontained/LICENSE.txt -Force
        Compress-Archive -Path publish-selfcontained/* -DestinationPath XtreemRgbToggle-portable-win-x64-selfcontained.zip

    - name: Calculate SHA256
      shell: pwsh
      run: |
        $hash = (Get-FileHash XtreemRgbToggle-portable-win-x64-selfcontained.zip -Algorithm SHA256).Hash
        "$hash  XtreemRgbToggle-portable-win-x64-selfcontained.zip" | Out-File -FilePath SHA256SUMS.txt -Encoding ascii
        Get-Content SHA256SUMS.txt

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          XtreemRgbToggle-portable-win-x64-selfcontained.zip
          SHA256SUMS.txt
        prerelease: true
        body: |
          Self-contained win-x64 portable ZIP (bundles .NET 8 Desktop runtime as a folder).

          PawnIO **kernel driver** is still required from https://pawnio.eu.
          Bundled PawnIOLib.dll and SmbusPIIX4.bin do not install that driver.

          No installer asset. Hardware/UI timings are unmeasured in CI.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
